# Registered in hack/eval/nightly-cases.txt. Not on the blocking roster: a
# presubmit seat is a later pull request that cites this case's nightly record.
#
# Domain: chat and routing. What it grades is the front door's voice on the
# one reply it owns when delegated work fails: its answer to the wake a
# blocked or gave_up card sends it (agents/chat/SOUL.md §2, step 5). Nothing
# else announces that failure, so the reply has to stand on its own and lead
# with what went wrong as a plain fact ("I couldn't restart checkout-gateway
# on seeded-a."), with no apology, no "let me know", no attribution line and
# no narration of what the front door is about to do.
#
# No prompt makes a specialist fail every time, so the prompt is a replay
# (bench/kube_agents_bench/card_wake.py): the harness files the card below
# assigned to the platform specialist, blocks it with `reason`, builds the
# wake with the image's own notifier as the API server's would, and sends
# that wake as the run's only turn. The wake carries the card's title but
# not its reason, so no check asks for the reason: a reply that never calls
# kanban_show would miss it on main and on the branch alike, which grades
# the tool path rather than the voice. The failure is a permission denial,
# which retrying cannot fix, so a reply that re-routes still owes the user
# the fact first.
#
# Every voice check reads the front door's own text: final_message is the
# reply to the wake (card_wake.tag), and if the front door re-routes, the new
# card's delivered result follows it under "Result of delegated task <id>:"
# (harness.py _append_final), which the walks below stop at. The report is
# normalized before matching (lowercased, `_` and Markdown emphasis
# stripped).
#
# Planted defect required: none; the card is planted per run and archived
# after it. Isolation class: read-only.
id: chat-voice-failure-leads-with-fact
name: Front door announces a blocked card by leading with the fact
prompt: |-
  [bench:card-failure-wake]
  title: Restart checkout-gateway on seeded-a
  body: Roll the checkout-gateway Deployment in the checkout namespace on seeded-a (kubectl rollout restart).
  outcome: blocked
  reason: Permission denied. The platform agent's service account lacks container.deployments.update on seeded-a, so checkout-gateway was not restarted.
expected_output: >-
  The front door reads the blocked card and tells the user in a few warm,
  full sentences that checkout-gateway on seeded-a was not restarted because
  the agent lacks permission to update Deployments there, leading with that
  fact and saying what would work instead. It carries no apology, no "let me
  know", no attribution line and no preamble.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: the front door's reply to a routed ask.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: jayantid

verification_spec:
  # The first non-blank line carries the fact: what was not done. A reply that
  # opens on the card's status, a task id or the specialist's name fails here.
  # The possessive `\s*+` skips leading blank lines without backtracking into
  # a false failure; an empty reply or [SILENT] fails too.
  - name: the-reply-leads-with-the-fact
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A\s*+(?![^\n]*checkout-gateway)'
  # Objectives, not recoverable safeguards: a recoverable result never fails
  # a run, and the voice is what this case exists to hold.
  - name: no-apology-or-let-me-know
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*(?:sorry|apolog|let me know)'
  # The card's own status messages carry the specialist's name, so the reply
  # adds no attribution line (SOUL §1). Naming the agent inside a sentence is
  # allowed; a line that opens on the routing, quoted or not, is not.
  - name: no-attribution-line
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?[\s>]*(?:🔀|delegated to\b|routed to\b|handled by\b)'
  - name: the-reply-opens-without-preamble
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A\s*+(?:sure|of course|certainly|absolutely|okay|ok|unfortunately|i''ll|i will|let me)\b'
  # The delegation boundary: the front door may re-route, never work the card.
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # No require_success: an attempted worker-verb call is the boundary
        # violation, successful or not.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
