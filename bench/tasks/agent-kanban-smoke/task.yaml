# Smoke task: exercises the eval pipeline end to end without provisioning
# infrastructure, using only capability the deployed agent actually ships
# with. The platform agent's config (both the image default and the
# operator-rendered production ConfigMap) denylists terminal/file/shell
# toolsets and enables kanban, so the probe must be a kanban action — a task
# that asks for shell access scores 0 against any real deployment.
id: agent-kanban-smoke
name: Agent kanban smoke test
prompt: >-
  Create a kanban task titled exactly "devops-bench smoke probe", then state in
  one sentence the id that was assigned to it.
expected_output: >-
  A kanban task titled "devops-bench smoke probe" is created via the kanban
  tooling, and the final message states the id assigned to it.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml (in review): the probe exercises the chat
# front door's delegation plumbing -- receive, plan, file a kanban card.
domain: chat-and-routing

# The kanban_create call is the whole point of the probe: a green judge score
# with no kanban call would mean the agent talked about creating a task instead
# of creating it. It is now the only thing graded deterministically here, which
# is a deliberate narrowing and not a stronger case.
#
# What went: a report_contains objective requiring the literal phrase
# "devops-bench smoke probe" in the closing message. It graded the prompt more
# than the agent -- on PR 890 (build 2091367133568045056) the agent filed the
# card with the exact title and closed "The id assigned is `t_faecff25`.", and
# the check failed for want of a phrase nothing had asked it to repeat. #893
# answered that by making the prompt ask for the title back. The reason not to
# keep it that way is the gate, not a measured flake: the presubmit floor for
# VerificationCorrectness is 1.0 (DETERMINISTIC_CORRECTNESS_FLOOR in
# hack/ci-eval-pr.sh), so an objective grading a language model's wording reds
# every open pull request in the repo the first time the model words it
# differently, and no prompt makes wording deterministic. There is no observed
# failure of the post-#893 prompt: PR 894's red (build 2091949646363496448) was
# the same pre-#893 mismatch, since #894 merged first and its presubmit never
# ran the new prompt.
#
# Know what that gives up. This is the only task in ci-eval-pr.sh's TASKS that
# always runs and always counts against the PR -- the other is deployer: tofu,
# and an infra death routes it to INFRA -- and it now has no check that reads
# final_message. The shape bench/tests/test_final_message.py pins as real, a
# later settle overwriting the kanban answer ("created, the id is 7" -> "the
# card settled"), would still call kanban_create, still pass here, and not red
# the presubmit. expected_output keeps the answer in front of the judge, but
# OutcomeValidity is recorded and no longer gates a spec-carrying task, so that
# is a trend to read rather than a gate. Put a report assertion back the day one
# can be written that does not grade wording.
#
# The id is a judged requirement via expected_output above, not an objective.
# It is minted per run (t_faecff25 was one run's), so no literal phrase can
# match it, and report_contains matches substrings only -- required_phrases,
# any_of_phrases, forbidden_phrases, and a scope selector, with no regex or
# pattern field to borrow. The one available bodge, requiring the substring
# "t_", would pass any sentence that happens to contain those two characters
# and fail a correct report that wrote the id some other way, so it would grade
# spelling rather than the answer. Turn it into an objective the day the
# verifier grows a pattern matcher.
verification_spec:
  - name: the-kanban-card-was-actually-filed
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      # An errored kanban_create filed no card, so only successful
      # calls count toward this objective.
      require_success: true
