  # No retry, requeue or second card offered or started beside the
  # dispatcher's retry; that runs the work twice. A re-route offer passes
  # ("Should I hand it to the cluster agent?", "I can re-route it"), since
  # SOUL step 5 names it; the new-work fence still fails one made unasked.
  # Four shapes, one pattern each. A question sentence that asks for a
  # retry ("Do you want another attempt?", "Want it requeued?"); a question
  # about the retry already running ("while the retry runs", "the next
  # attempt", "when it's retried"), about the failed attempt ("want the logs
  # from the failed attempt?"), or about telling the user passes. A
  # conditional ("if you'd like it rerun", "say the word and it gets
  # requeued"). A first-person offer ("I can retry it", "happy to resubmit
  # it", "I've queued a duplicate"), with only filler words between the
  # opener and the verb ("I can go ahead and retry it"), so "I'll check back
  # once the retry finishes" passes, and so does filing an issue ("want me
  # to file an issue about the OOM?") unless a second card comes with it
  # ("file an issue and a new card"). A question whether to have it retried
  # ("do you want it to be retried?"), which the first shape skips after
  # "be". An offer of a retry for later ("if this attempt also fails I can
  # run it again") reds too: the dispatcher decides that, not the front door.
  # A retry word after "the" or "of", or with the dispatcher, worker or agent
  # as its subject, is the retry already running ("should I look at the OOM
  # before the worker reruns?", "I can share the result of the retry if
  # you'd like"), and a question that opens its own clause after a comma
  # ("it'll retry automatically, should I keep an eye on it?") is not about
  # it, nor is a retry noun naming what is offered ("retry status pings?").
  # The question and want-it-retried patterns scan each clause once from its
  # start, so a long line costs linear time; a question mark more than 200
  # characters past the retry word is not read, a second bound.
  - name: the-reply-does-not-offer-the-retry
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*?(?:(?<![^\n])|(?<=[.!?:;—] )|(?<=—)|(?<=, )(?=(?:but |so |and )?(?:should|shall|want|would|do|does|can|could|may|is|are)\b))(?!(?:(?!, (?:but |so |and )?(?:should|shall|want|would|do|does|can|could|may|is|are)\b)[^.!?;:—\n])*?\b(?:let you know|tell you|update you|ping you|notify you|keep you posted))(?:(?!\b(?<!the )(?<!dispatcher )(?<!worker )(?<!agent )(?<!the card )(?<!the task )(?<!on )(?<!next )(?<!this )(?<!that )(?<!its )(?<!while )(?<!when )(?<!after )(?<!until )(?<!once )(?<!before )(?<!during )(?<!''s )(?<!is )(?<!been )(?<!being )(?<!be )(?<!gets )(?<!before it )(?<!until it )(?<!once it )(?<!when it )(?<!after it )(?<!while it )(?<!whether a )(?<!if a )(?:re-?tr(?:y|ies|ied|ying)(?! (?:status|updates?|notifications?|pings?|results?|outcome)\b)|re-?run|rerun|try (?:it |that |this )?again|run (?:it |that |this )?again|(?:another|a new|a fresh|one more) (?:attempt|try|go|shot)|re-?queu|queue (?:it|this|that|another|a)\b|back (?:in|into|on|to) the queue|kick (?:it |that |this )?off|file (?:a|an|another|new)\b(?! (?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b(?! (?:card|task)s?\b)(?![^.!?;\n]{0,60}?\b(?:a|an|another|new|second|separate) (?:new |fresh |issue )*(?:card|task)\b))|filed\b(?! (?:a |an )?(?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b(?! (?:card|task)s?\b)(?![^.!?;\n]{0,60}?\b(?:a|an|another|new|second|separate) (?:new |fresh |issue )*(?:card|task)\b))|re-?dispatch\w*|spin (?:up|off)\b|(?:a |another )?(?:second|parallel|duplicate|separate) (?:card|task|run|worker|check|attempt|one|copy)\b|resubmit\w*|relaunch\w*|start (?:over|a new|another)\b|create (?:a |another )?(?:new |fresh )?(?:card|task)\b|another run\b))(?!, (?:but |so |and )?(?:should|shall|want|would|do|does|can|could|may|is|are)\b)[^.!?;:—\n])*\b(?<!the )(?<!dispat