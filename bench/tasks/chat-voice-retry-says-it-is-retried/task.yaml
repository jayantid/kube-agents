        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*?(?:(?:if you(?:''d)? (?:want|like|prefer|wish)|just (?:ask|say)|say the word|ask me|let me know)(?: [\w''-]+){0,4}? (?<!the )(?<!its )(?<!next )(?<!while it )(?<!when it )(?<!once it )(?<!after it )(?:re-?tr(?:y|ies|ied|ying)|re-?run\w*|rerun\w*|re-?queu\w*|try (?:it |that |this )?again|run (?:it |that |this )?again|another (?:attempt|try|go|run|shot)|re-?dispatch\w*|spin (?:up|off)\b|(?:a |another )?(?:second|parallel|duplicate|separate) (?:card|task|run|worker|check|attempt|one|copy)\b|resubmit\w*|relaunch\w*|start (?:over|a new|another)\b|create (?:a |another )?(?:new |fresh )?(?:card|task)\b|another run\b)|(?<!the )(?<!of )(?<!while it )(?<!when it )(?<!once it )(?<!after it )(?:re-?tr(?:y|ies|ied|ying)|re-?run\w*|rerun\w*|re-?queu\w*|try (?:it |that |this )?again|run (?:it |that |this )?again|another (?:attempt|try|go|run|shot)|re-?dispatch\w*|spin (?:up|off)\b|(?:a |another )?(?:second|parallel|duplicate|separate) (?:card|task|run|worker|check|attempt|one|copy)\b|resubmit\w*|relaunch\w*|start (?:over|a new|another)\b|create (?:a |another )?(?:new |fresh )?(?:card|task)\b|another run\b)(?: (?:it|that|this|again|the \w+))? (?:if you(?:''d)? (?:want|like|prefer|wish)|on request|if you ask))'
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*?\b(?:want me to|shall i|should i|do you want(?: me)? to|would you like(?: me)? to|i can|i could|i''ll|i will|i''d|i would|let me|(?:i''m )?happy to|(?:i''m )?glad to|i''m able to|i''m (?:also )?going to|i''ve)(?: (?:also|just|go|ahead|and|up|gladly|happily|manually|now|immediately|then|right|away|quickly|certainly|definitely|easily|have|get|make|start|give|it|that|this|them|you|a|new|fresh|to|try|the (?:agent|worker|task|card|check|dispatcher)))*? (?<!the )(?:re-?tr(?:y|ies|ied|ying)|re-?run|rerun|re-?queu\w*|queue\w* (?:it|this|that|another|a)\b|try (?:it |that |this )?again|run (?:it |that |this )?again|another (?:attempt|try|go|run|shot)|a (?:new |fresh )?(?:retry|re-?run|attempt)|kick (?:it |that |this )?off|file (?:a|an|another|new)\b(?! (?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b(?! (?:card|task)s?\b)(?![^.!?;\n]{0,60}?\b(?:a|an|another|new|second|separate) (?:new |fresh |issue )*(?:card|task)\b))|filed\b(?! (?:a |an )?(?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b(?! (?:card|task)s?\b)(?![^.!?;\n]{0,60}?\b(?:a|an|another|new|second|separate) (?:new |fresh |issue )*(?:card|task)\b))|restart (?:it|this|that|the (?:investigation|task|card|run|worker|check))\b|re-?dispatch\w*|spin (?:up|off)\b|(?:a |another )?(?:second|parallel|duplicate|separate) (?:card|task|run|worker|check|attempt|one|copy)\b|resubmit\w*|relaunch\w*|start (?:over|a new|another)\b|create (?:a |another )?(?:new |fresh )?(?:card|task)\b|another run\b|open (?:a |another |new )+(?:card|task)|send (?:it|this|that) back)'
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*?(?:(?<![^\n])|(?<=[.!?;]))(?:(?!\b(?:do you want|would you like|want|wanna)(?: it| this| that| the (?:card|task|check|investigation|run))? (?:to )?(?:be |get )?(?:re-?tr|re-?run|rerun|re-?queu|tried again|run again)(?![\w-]* (?:status|updates?|notifications?|pings?|results?|outcome)\b))[^.!?;\n])*\b(?:do you want|would you like|want|wanna)(?: it| this| that| the (?:card|task|check|investigation|run))? (?:to )?(?:be |get )?(?:re-?tr|re-?run|rerun|re-?queu|tried again|run again)(?![\w-]* (?:status|updates?|notifications?|pings?|results?|outcome)\b)[^.!?;\n]{0,200}\?'
  # Not the final-failure announcement: no "gave up", "last attempt" or
  # "retry limit", no retry denied ("won't be retried", "it can't be
  # retried", "there won't be another attempt", "nobody is retrying it",
  # "it wasn't requeued", "never returned to the queue", "no next attempt"),
  # and no retry handed to the user ("whether to retry is up to you", "you
  # need to rerun it", "you're going to try again yourself", "feel free to
  # re-run it", "it needs a manual rerun",
  # "a further retry — up to you", "it's worth trying again"), no retry
  # denied by its schedule ("it's not set to be retried", "it's unlikely to
  # be retried", "it's never going to be tried again", "it wasn't requeued
  # yet and it won't be"), and no retry hedged by a listed word before it
  # ("I think", "I don't think", "maybe", "perhaps", "I expect") or held for
  # approval ("it will be retried once you approve"). Approving something
  # named ("once you approve the quota bump") is not held for approval, and
  # a quoted error ("please try again later") is not a hand-off.
  # "Probably" and "likely" are not listed: "it most likely OOMed and will
  # be retried" hedges the cause, not the retry. "Up to you" about
  # something past the retry passes when a word names it ("once the retry
  # finishes, what to do next is up to you", "the root cause is your call").
  # A failure in the reason ("the logs could not be read") is not a final
  # announcement, so "couldn't" is not forbidden, and neither is "it hasn't
  # given up", "nothing has failed for good", "please do not retry it
  # yourself", "no reason to retry it yourself", "you won't have to rerun it", or the front door declining a
  # second run beside the stated retry ("so I won't requeue it", "I won't
  # re-run it myself"), or a negation that leaves the retry standing ("it
  # isn't out of retries", "hasn't been retried yet"). A bare "I won't
  # retry it" still reds.
  # A hedge or denial whose object is "the retry" is about the retry
  # succeeding, not about whether it happens ("I'm not sure the retry will
  # fix it", "this won't affect the retry"), and passes; so does turning down
  # a manual or a second run ("no manual rerun is needed", "there isn't
  # anything to retry by hand", "I don't recommend retrying it manually",
  # "no one is running it again in parallel", "I haven't requeued
  # anything"), and "the rest is your call". So do a limit on how long it
  # retries ("it won't retry forever; there's a cap"), what the user may see
  # ("you might notice it requeued"), and whether to wait ("your call whether
  # to wait or move on").
  - name: the-reply-does-not-call-it-final
    role: objective
    mode: assert
    check:
