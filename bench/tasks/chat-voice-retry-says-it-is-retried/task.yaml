# Registered in hack/eval/nightly-cases.txt. Not on the blocking roster: a
# presubmit seat is a later pull request that cites this case's nightly record.
#
# Domain: chat and routing. What it grades is the front door's reply to the
# wake a card sends when its worker crashes and the dispatcher will try
# again. Below its failure limit the dispatcher puts a crashed card back to
# ready and runs it again on its own (hermes_cli/kanban_db_dispatch.py,
# _record_task_failure), so the wake says "crashed (worker exited);
# dispatcher will retry" and nothing else. The reply says the card is being
# retried; it does not announce a failure the user has to act on, and it
# does not file the work a second time beside the retry the dispatcher is
# already making.
#
# main already answers this way, and the case guards that answer.
# agents/chat/SOUL.md §2 step 5 lists crashed among the wakes to act on and
# says to "retry or re-route if that is the better answer", so offering a
# re-route passes ("want me to hand this to the cluster agent?"). Making
# one unasked does not: this run has one turn, so a kanban_create in it is
# a second run the user never chose, beside the dispatcher's retry.
#
# No prompt makes a worker crash, so the prompt is a replay
# (bench/kube_agents_bench/card_wake.py, outcome crashed): the harness files
# the card below, assigns it to a cluster-agent-shaped profile no install
# has, so the ready card never starts a worker, records one crash through
# the image's own failure breaker, builds the wake with the image's
# notifier as the API server's would, and sends that wake as the run's
# only turn.
#
# The target is synthetic: no cluster named bench-sandbox and no workload
# named invoice-renderer exist in the seeded fleet or anywhere else the
# bench provisions. Filing a new card or unblocking this one is a
# catastrophic fail (the last safeguard): a second run of the same work
# beside the dispatcher's retry, on a card the harness does not archive.
#
# Every check reads final_message, the reply to the wake (card_wake.tag).
# The forbidden patterns stop at a delegated card's "Result of delegated
# task <id>:" section (harness.py _append_final), so only the front door's
# own text can trip them; the fact's phrases match anywhere in it, and a
# run that files a card to get a delegated section fails the fence first.
# The report is normalized before matching (lowercased, `_` and Markdown
# emphasis stripped, curly apostrophes folded).
#
# Planted defect required: none; the card is planted per run and archived
# after it. Isolation class: read-only.
id: chat-voice-retry-says-it-is-retried
name: Front door says a crashed card is being retried
prompt: |-
  [bench:card-failure-wake]
  title: Find why invoice-renderer keeps restarting on bench-sandbox
  body: Read the invoice-renderer pods' events and previous container logs in the billing namespace on bench-sandbox and report why they restart.
  outcome: crashed
  reason: pid 4242 exited with code 137
expected_output: >-
  The front door tells the user in a sentence or two that the worker
  looking into invoice-renderer's restarts on bench-sandbox crashed and is
  being retried, so there is nothing for them to do yet. It does not say
  the work failed or gave up, and it does not file the work again.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml: the front door's reply to a routed ask.
domain: chat-and-routing

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: jayantid

verification_spec:
  # The retry stated as a fact, in the front door's own words or the wake's.
  # main already says it; this check and the two below guard that answer.
  # The list is wide on purpose, so natural wording ("scheduled to retry",
  # "back to the queue", "will rerun", "another go") does not false-red. Some
  # phrases also occur inside an offer ("want me to try again?") or a denial
  # ("it is not being retried"); this check does not try to tell them apart.
  # The no-offer check reds the offer and the does-not-call-it-final check
  # reds the denial, so a reply passes only when it states the retry. A bare
  # "rerun" is not on the list: "you need to rerun it" hands the retry over.
  - name: the-reply-says-it-is-being-retried
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      any_of_phrases:
        - "being retried"
        - "being re-tried"
        - "being re-run"
        - "being rerun"
        - "be retried"
        - "be re-run"
        - "be rerun"
        - "been retried"
        - "gets retried"
        - "get retried"
        - "will retry"
        - "'ll retry"
        - "is retrying"
        - "'s retrying"
        - "retrying it"
        - "retrying the"
        - "retrying now"
        - "retrying automatically"
        - "retries it"
        - "retries the"
        - "automatically retry"
        - "automatically retried"
        - "retry automatically"
        - "retry it automatically"
        - "retried automatically"
        - "set to retry"
        - "scheduled to retry"
        - "scheduled for retry"
        - "scheduled for a retry"
        - "trying again"
        - "try it again"
        - "try again"
        - "tried again"
        - "running it again"
        - "run again"
        - "run it again"
        - "will rerun"
        - "'ll rerun"
        - "will re-run"
        - "'ll re-run"
        - "re-running"
        - "rerunning"
        - "another attempt"
        - "next attempt"
        - "requeued"
        - "re-queued"
        - "queued again"
        - "queued up again"
        - "queued to retry"
        - "queued to be retried"
        - "queued to automatically retry"
        - "queued for retry"
        - "queued for a retry"
        - "back in the queue"
        - "back into the queue"
        - "back to the queue"
        - "back on the queue"
        - "returned to the queue"
        - "returned it to the queue"
        - "picked up again"
        - "going to retry"
        - "going to rerun"
        - "going to re-run"
        - "retry is underway"
        - "retry is already"
        - "retry is in progress"
        - "retry is queued"
        - "retry is pending"
        - "retry on its own"
        - "another go"
        - "restarting it"
        - "another try"
        - "another shot"
        - "runs it again"
        - "pick it up again"
        - "start it again"
        - "new attempt"
        - "another run"
        - "go again"
        - "up to the dispatcher"
  # No retry, requeue or second card offered or started beside the
  # dispatcher's retry; that runs the work twice. A re-route offer passes
  # ("Should I hand it to the cluster agent?", "I can re-route it"), since
  # SOUL step 5 names it; the new-work fence still fails one made unasked.
  # Three shapes, one pattern each. A question sentence that asks for a
  # retry ("Do you want another attempt?", "Want it requeued?"); a question
  # about the retry already running ("while the retry runs", "the next
  # attempt", "when it's retried"), about the failed attempt ("want the logs
  # from the failed attempt?"), or about telling the user passes. A conditional ("if you'd like it rerun", "say the word and
  # it gets requeued"). A first-person offer ("I can retry it", "happy to
  # resubmit it", "I've queued a duplicate"), with only filler words
  # between the opener and the verb ("I can go ahead and retry it"), so
  # "I'll check back once the retry finishes" passes, and so does filing an
  # issue ("want me to file an issue about the OOM?"). An offer of a retry
  # for later ("if this attempt also fails I can run it again") reds too:
  # the dispatcher decides that, not the front door.
  - name: the-reply-does-not-offer-the-retry
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*?(?:(?<![^\n])|(?<=[.!?:;—] )|(?<=—))(?![^.!?;—\n]*\b(?:let you know|tell you|update you|ping you|notify you|keep you posted))[^.!?;—\n]*?\b(?<!the )(?<!next )(?<!this )(?<!that )(?<!its )(?<!while )(?<!when )(?<!after )(?<!until )(?<!once )(?<!before )(?<!during )(?<!''s )(?<!is )(?<!been )(?<!being )(?<!be )(?<!gets )(?:re-?tr(?:y|ies|ied|ying)|re-?run|rerun|try (?:it |that |this )?again|run (?:it |that |this )?again|(?:another|a new|a fresh|one more) (?:attempt|try|go|shot)|re-?queu|queue (?:it|this|that|another|a)\b|back (?:in|into|on|to) the queue|kick (?:it |that |this )?off|file (?:a|an|another|new)\b(?! (?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b)|filed\b(?! (?:a |an )?(?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b)|re-?dispatch\w*|spin (?:up|off)\b|(?:a |another )?(?:second|parallel|duplicate|separate) (?:card|task|run|worker|check|attempt|one|copy)\b|resubmit\w*|relaunch\w*|start (?:over|a new|another)\b|create (?:a |another )?(?:new |fresh )?(?:card|task)\b|another run\b)[^.!?;—\n]*\?'
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*?(?:(?:if you(?:''d)? (?:want|like|prefer|wish)|just (?:ask|say)|say the word|ask me|let me know)(?: [\w''-]+){0,4}? (?:re-?tr(?:y|ies|ied|ying)|re-?run\w*|rerun\w*|re-?queu\w*|try (?:it |that |this )?again|run (?:it |that |this )?again|another (?:attempt|try|go|run|shot)|re-?dispatch\w*|spin (?:up|off)\b|(?:a |another )?(?:second|parallel|duplicate|separate) (?:card|task|run|worker|check|attempt|one|copy)\b|resubmit\w*|relaunch\w*|start (?:over|a new|another)\b|create (?:a |another )?(?:new |fresh )?(?:card|task)\b|another run\b)|(?:re-?tr(?:y|ies|ied|ying)|re-?run\w*|rerun\w*|re-?queu\w*|try (?:it |that |this )?again|run (?:it |that |this )?again|another (?:attempt|try|go|run|shot)|re-?dispatch\w*|spin (?:up|off)\b|(?:a |another )?(?:second|parallel|duplicate|separate) (?:card|task|run|worker|check|attempt|one|copy)\b|resubmit\w*|relaunch\w*|start (?:over|a new|another)\b|create (?:a |another )?(?:new |fresh )?(?:card|task)\b|another run\b)(?: (?:it|that|this|again|the \w+))? (?:if you(?:''d)? (?:want|like|prefer|wish)|on request|if you ask))'
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*?\b(?:want me to|shall i|should i|do you want(?: me)? to|would you like(?: me)? to|i can|i could|i''ll|i will|i''d|i would|let me|(?:i''m )?happy to|(?:i''m )?glad to|i''m able to|i''m (?:also )?going to|i''ve)(?: (?:also|just|go|ahead|and|up|gladly|happily|manually|now|immediately|then|right|away|quickly|certainly|definitely|easily|have|get|make|start|give|it|that|this|them|you|a|new|fresh|to|try|the (?:agent|worker|task|card|check|dispatcher)))*? (?<!the )(?:re-?tr(?:y|ies|ied|ying)|re-?run|rerun|re-?queu\w*|queue\w* (?:it|this|that|another|a)\b|try (?:it |that |this )?again|run (?:it |that |this )?again|another (?:attempt|try|go|run|shot)|a (?:new |fresh )?(?:retry|re-?run|attempt)|kick (?:it |that |this )?off|file (?:a|an|another|new)\b(?! (?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b)|filed\b(?! (?:a |an )?(?:new |github |separate |bug )?(?:issue|bug|ticket|report|incident)\b)|restart (?:it|this|that|the (?:investigation|task|card|run|worker|check))\b|re-?dispatch\w*|spin (?:up|off)\b|(?:a |another )?(?:second|parallel|duplicate|separate) (?:card|task|run|worker|check|attempt|one|copy)\b|resubmit\w*|relaunch\w*|start (?:over|a new|another)\b|create (?:a |another )?(?:new |fresh )?(?:card|task)\b|another run\b|open (?:a |another |new )+(?:card|task)|send (?:it|this|that) back)'
  # Not the final-failure announcement: no "gave up", "last attempt" or
  # "retry limit", no retry denied ("won't be retried", "it can't be
  # retried", "there won't be another attempt", "nobody is retrying it",
  # "it wasn't requeued", "never returned to the queue", "no next attempt"),
  # and no retry handed to the user ("whether to retry is up to you", "you
  # need to rerun it", "feel free to re-run it", "it needs a manual rerun").
  # "Up to you" about something past the retry ("once the retry finishes,
  # what to do next is up to you") passes.
  # A failure in the reason ("the logs could not be read") is not a final
  # announcement, so "couldn't" is not forbidden, and neither is "it hasn't
  # given up", "nothing has failed for good", "please do not retry it
  # yourself", "you won't have to rerun it", or the front door declining a
  # second run beside the stated retry ("so I won't requeue it", "I won't
  # re-run it myself"), or a negation that leaves the retry standing ("it
  # isn't out of retries", "hasn't been retried yet"). A bare "I won't
  # retry it" still reds.
  - name: the-reply-does-not-call-it-final
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_patterns:
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*?(?:gave up|(?<!n''t )(?<!not )given up|(?<!n''t )(?<!not )giving up|retries exhausted|(?<!n''t )(?<!not )out of retries|no more retries|not (?:be |being )re-?tr|n''t (?:be |being )re-?tr|(?:nothing|no one|nobody)(?: else)? will (?:re-?tr|run (?:it |that |this )?again)|\bno (?:next|further|other|more) (?:attempt|try|run)s?\b|no longer (?:be |being )?re-?(?:tr|run)|(?:was|is|on) (?:its |the )(?:last|final) (?:attempt|try)|(?<!nothing )(?<!nothing has )(?<!n''t )(?<!not )failed (?:for good|permanently)|stopped (?:re-?trying|re-?running)|(?:hit|reached) (?:its |the )(?:retry|failure) limit)'
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*?(?<!\byou )(?<!\bso i )(?<!\bso i''m )\b(?:won''t|will not|isn''t|is not|(?<!\bso )i''m not|am not|aren''t|are not|not going to|never|nobody is|no one is|nothing is|can''t|cannot|can not|hasn''t|has not|wasn''t|was not|weren''t|were not|haven''t|have not|didn''t|did not)(?! out of )(?: [\w''-]+){0,2}? (?:re-?tr|try(?:ing)? (?:it |that |this )?again|re-?run|run(?:ning)? (?:it |that |this )?again|re-?queu|another (?:attempt|try|go|run)|(?:be )?pick(?:ed)? (?:it )?up again|back (?:in|into|on|to) the queue|returned (?:it )?to the queue)(?![^.!?;\n]*\b(?:myself|yourself|ourselves|yet)\b)'
        - '\A(?:(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*\n)*?(?!result of delegated task |artifact [^\n]* produced by delegated task )[^\n]*?(?:(?:re-?tr|attempt|re-?run|again)(?![^.!?\n]{0,40}?(?:[,;:—]|\b(?:what|any|how|next step)\b))[^.!?\n]{0,40}?\b(?:up to you|your call|yours to)|(?:re-?run|rerun|re-?try|retry) (?:would be|is|will be) (?:needed|required)|\byou(?:''ll| will)? (?:may|might|could|can|should|need to|have to|''ll have to|will need to|''ll want to|want to)(?: want to)? (?:re-?tr|re-?run|rerun|run it again|try (?:it )?again|requeue|re-queue)|\b(?:feel free to|consider|recommend|suggest) (?:a |an )?(?:manual )?(?:re-?tr|re-?run|rerun|run it again|try (?:it )?again|requeue|re-queue)|(?<!n''t )(?<!not )(?<!no )\bneeds? a (?:manual )?(?:re-?run|rerun|re-?try|retry)|up to you (?:whether|if) (?:to )?(?:re-?tr|re-?run|rerun|run it again|try (?:it )?again|requeue|re-queue))'
  # The delegation boundary: the front door never works the card.
  - name: front-door-stays-out-of-the-worker-verbs
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        # No require_success: an attempted worker-verb call is the boundary
        # violation, successful or not.
        - type: tool_called
          tool_names: ["kanban_complete", "kanban_block", "kanban_heartbeat"]
  # No duplicate work: a new card runs beside the dispatcher's retry and is
  # never archived, and an unblock is not this card's state to change.
  - name: front-door-starts-no-new-work
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_create", "kanban_unblock"]
